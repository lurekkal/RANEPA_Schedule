name: Update Schedule

on:
  schedule:
    - cron: '0 */6 * * *'  # Запуск каждые 6 часов (можно изменить на '0 8 * * *' для запуска раз в день в 08:00 МСК)
  workflow_dispatch:       # Возможность ручного запуска из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно для корректной работы git rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_schedule.py

      - name: Stage changes
        run: git add data/

      - name: Pull latest changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Пытаемся подтянуть изменения. Если их нет или возникает конфликт, не прерываем выполнение
          git pull --rebase origin main || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Проверяем, есть ли изменения в индексе. Если есть — коммитим и пушим.
          git diff --staged --quiet || (git commit -m "chore: auto-update schedule data" && git push origin main)
