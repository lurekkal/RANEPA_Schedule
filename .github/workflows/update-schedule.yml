name: Update university schedule
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # ежедневно в 06:17 по Москве (UTC+3)
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_schedule.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet || (git commit -m "chore: refresh university schedule" && git push)
